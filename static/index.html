<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Sys | Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>🛒 Sistema de Inventario y Ventas</h1>
        </header>

        <!-- Pantalla de login -->
        <div id="login-section" class="card">
            <h2>Iniciar Sesión</h2>
            <div class="form-group">
                <input type="text" id="username" placeholder="Usuario" autocomplete="off">
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Contraseña">
            </div>
            <div class="botones">
                <button onclick="login()" class="btn-primary">Entrar</button>
                <button onclick="registro()" class="btn-secondary">Registrarse</button>
            </div>
        </div>

        <!-- Aplicación principal -->
        <div id="main-section" style="display:none;">
            <nav id="menu">
                <button onclick="mostrarSeccion('productos')">📦 Productos</button>
                <button onclick="mostrarSeccion('ventas')">💰 Ventas</button>
                <button onclick="mostrarSeccion('movimientos')">📊 Movimientos</button>
                <button id="btn-usuarios" onclick="mostrarSeccion('usuarios')" style="display:none;">👥 Usuarios</button>
                <button onclick="cerrarSesion()" class="btn-danger">🚪 Cerrar sesión</button>
            </nav>
            <main id="contenido"></main>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
